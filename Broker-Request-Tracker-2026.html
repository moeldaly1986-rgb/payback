function doGet(e) {
  const action = (e && e.parameter && e.parameter.action) || 'read';
  const reqEmp = String((e && e.parameter && e.parameter.employee) || '').trim();
  const reqSession = String((e && e.parameter && e.parameter.sessionId) || '').trim();
  const isAdmin = String((e && e.parameter && e.parameter.role) || '').trim() === 'admin';
  const ss = SpreadsheetApp.getActiveSpreadsheet();

  if (!isAdmin && reqEmp) {
    const check = checkEmployeeAccessAndSession_(ss, reqEmp, reqSession, false);
    const accessListNow = readAccessList_(ss);

      return jsonOut_({ ok: false, blocked: true, access: accessListNow, error: 'تم إيقاف صلاحية هذا الحساب من الإدارة' });
    }
    if (check.state === 'Unregistered') {
      return jsonOut_({ ok: false, unregistered: true, access: accessListNow, error: 'هذا الاسم غير مسجل في الصفحة الأساسية' });
    }
    if (check.state === 'InUse') {
      return jsonOut_({ ok: false, inUse: true, access: accessListNow, error: 'هذا الاسم مستخدم بالفعل في جلسة نشطة أخرى' });
    }
  }

  if (action === 'read') {
    const brokerRows = readSheetRows_(ss, 'Broker');
    const requestRows = readSheetRows_(ss, 'Request');
    const accessList = readAccessList_(ss);
    const adminsList = isAdmin ? readAdminsList_(ss) : [];
    return jsonOut_({ ok: true, broker: brokerRows, request: requestRows, access: accessList, admins: adminsList });
  }

  return jsonOut_({ ok: true, message: 'Proker Central Web App Active' });
}

function doPost(e) {
  try {
    const raw = (e && e.postData && e.postData.contents) ? e.postData.contents : '{}';
    const payload = JSON.parse(raw);
    const action = String(payload.action || 'upsert').trim();
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    if (action === 'adminLogin') {
      return jsonOut_(loginSubAdmin_(ss, payload.username, payload.password));
    }

    if (action === 'saveAdmin') {
      saveSubAdmin_(ss, payload.username, payload.password, payload.status, payload.permissions);
      return jsonOut_({ ok: true });
    }

    if (action === 'deleteAdmin') {
      deleteSubAdmin_(ss, payload.username);
      return jsonOut_({ ok: true });
    }

    if (action === 'deleteEmployee') {
      deleteEmployeeFromAccess_(ss, payload.employee);
      return jsonOut_({ ok: true, verified: true });
    }

    if (action === 'restoreBackup') {
      const result = restoreFullBackup_(ss, payload);
      return jsonOut_(result);
    }

    if (action === 'setAccess') {
      const targetEmp = String(payload.employee || '').trim();
      const status = String(payload.status || 'Active').trim();
      const clearSession = Boolean(payload.clearSession);
      const pass = payload.password !== undefined ? String(payload.password) : null;
      setEmployeeAccessStatus_(ss, targetEmp, status, clearSession, pass);
      return jsonOut_({ ok: true });
    }

    if (action === 'setPassword') {
      const targetEmp = String(payload.employee || '').trim();
      const newPass = String(payload.password || '');
      const stP = String(payload.status || '').trim();
      setEmployeePassword_(ss, targetEmp, newPass, stP);
      return jsonOut_({ ok: true });
    }

    if (action === 'login') {
      const targetEmp = String(payload.employee || '').trim();
      const pass = String(payload.password || '');
      const sessionId = String(payload.sessionId || '').trim();
      const shL = ensureAccessSheet_(ss);
      const lastL = shL.getLastRow();
      if (lastL < 2) return jsonOut_({ ok: false, state: 'Unregistered' });
      const rowsL = shL.getRange(2, 1, lastL - 1, Math.max(5, shL.getLastColumn())).getValues();
      for (let i = 0; i < rowsL.length; i++) {
        if (String(rowsL[i][0] || '').trim().toLowerCase() === targetEmp.toLowerCase()) {
          const stL = String(rowsL[i][1] || 'Active').trim().toLowerCase();
          if (stL === 'blocked' || stL === 'inactive' || stL === 'no' || stL === 'موقوف' || stL === 'محظور') {
            return jsonOut_({ ok: false, state: 'Blocked' });
          }
          const storedPass = String(rowsL[i][4] || '');
          if (!storedPass) return jsonOut_({ ok: false, state: 'NoPassword' });
          if (storedPass !== pass) return jsonOut_({ ok: false, state: 'WrongPassword' });
          if (sessionId) {
            shL.getRange(i + 2, 3, 1, 2).setValues([[sessionId, new Date().toISOString()]]);
          }
          const stateOut = (stL === 'paused' || stL === 'موقوف مؤقتا' || stL === 'موقوف مؤقتاً') ? 'Paused' : 'Active';
          return jsonOut_({ ok: true, state: stateOut });
        }
      }
      return jsonOut_({ ok: false, state: 'Unregistered' });
    }

    if (action === 'deleteRow') {
      const dSheet = payload.sheet === 'Request' ? 'Request' : 'Broker';
      const shD = ss.getSheetByName(dSheet);
      const dId = String(payload.rowId || '').trim();
      const dRowNum = Number(payload.sheetRow || 0);
      const idCol = dSheet === 'Broker' ? 16 : 10;
      if (shD && shD.getLastRow() >= 2) {
        if (dId) {
          const ids = shD.getRange(2, idCol, shD.getLastRow() - 1, 1).getValues();
          for (let i = 0; i < ids.length; i++) {
            if (String(ids[i][0] || '').trim() === dId) {
              shD.deleteRow(i + 2);
              return jsonOut_({ ok: true });
            }
          }
        }
        if (dRowNum >= 2 && dRowNum <= shD.getLastRow()) {
          shD.deleteRow(dRowNum);
        }
      }
      return jsonOut_({ ok: true });
    }

    if (action === 'renameEmployee') {
      const oldName = String(payload.oldEmployee || '').trim();
      const newName = String(payload.newEmployee || '').trim();
      if (oldName && newName) renameEmployeeEverywhere_(ss, oldName, newName);
      return jsonOut_({ ok: true });
    }

    if (action === 'reassignBroker') {
      const brokerName = String(payload.brokerName || '').trim();
      const targetEmp = String(payload.targetEmployee || '').trim();
      const fromEmp = String(payload.fromEmployee || '').trim();
      if (brokerName && targetEmp) reassignBrokerToEmployee_(ss, brokerName, fromEmp, targetEmp);
      return jsonOut_({ ok: true });
    }

    if (action === 'claimSession') {
      const targetEmp = String(payload.employee || '').trim();
      const sessionId = String(payload.sessionId || '').trim();
      return jsonOut_(checkEmployeeAccessAndSession_(ss, targetEmp, sessionId, true));
    }

    const sheetName = payload.sheet === 'Request' ? 'Request' : 'Broker';
    const row = payload.row || {};
    const employee = String(payload.employee || row.employee || '').trim();
    const sessionId = String(payload.sessionId || '').trim();
    const isAdmin = String(payload.role || '').trim() === 'admin';

    if (!isAdmin && employee) {
      const check = checkEmployeeAccessAndSession_(ss, employee, sessionId, true);
      if (check.state === 'Blocked') return jsonOut_({ ok: false, blocked: true, error: 'Account blocked' });
      if (check.state === 'Unregistered') return jsonOut_({ ok: false, unregistered: true, error: 'Account unregistered' });
      if (check.state === 'InUse') return jsonOut_({ ok: false, inUse: true, error: 'Session in use' });
    }

    const rowId = String(row.rowId || '').trim();
    const sh = ensureSheetWithHeaders_(ss, sheetName);

    if (sheetName === 'Broker') {
      const values = [
        employee,
        row.prokerName || '',
        row.role || 'OWNER',
        row.phone || '',
        Number(row.salesCount || 0),
        row.oriDate || '',
        row.oriStatus || 'موعد',
        Number(row.oriCount || 0),
        row.wsStatus || 'لا',
        Number(row.wsCount || 0),
        row.rating || 'جيد',
        Number(row.reqCount || 0),
        row.noteDate || '',
        row.notes || '',
        JSON.stringify(row.notesHistory || []),
        rowId
      ];
      upsertRowByIdOrIndex_(sh, rowId, 16, row.sheetRow, values);
    } else {
      const values = [
        employee,
        row.company || '',
        row.agentName || '',
        row.phone || '',
        row.reqDate || '',
        row.reqType || 'سكني',
        row.editDate || '',
        row.details || '',
        JSON.stringify(row.detailsHistory || []),
        rowId
      ];
      upsertRowByIdOrIndex_(sh, rowId, 10, row.sheetRow, values);
    }

    return jsonOut_({ ok: true, verified: true, ts: new Date().toISOString() });
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err) });
  }
}

function restoreFullBackup_(ss, payload) {
  const brokers = Array.isArray(payload.brokers) ? payload.brokers : [];
  const requests = Array.isArray(payload.requests) ? payload.requests : [];
  const access = Array.isArray(payload.access) ? payload.access : [];
  const subAdmins = Array.isArray(payload.subAdmins) ? payload.subAdmins : [];

  // 1. Restore Broker sheet
  const shB = ensureSheetWithHeaders_(ss, 'Broker');
  if (shB.getLastRow() > 1) {
    shB.getRange(2, 1, shB.getLastRow() - 1, Math.max(16, shB.getLastColumn())).clearContent();
  }
  const brokerValues = brokers
    .filter(b => b && String(b.prokerName || '').trim())
    .map(b => [
      String(b.employee || '').trim(),
      String(b.prokerName || '').trim(),
      String(b.role || 'OWNER'),
      String(b.phone || ''),
      Number(b.salesCount || 0),
      String(b.oriDate || ''),
      String(b.oriStatus || 'موعد'),
      Number(b.oriCount || 0),
      String(b.wsStatus || 'لا'),
      Number(b.wsCount || 0),
      String(b.rating || 'جيد'),
      Number(b.reqCount || 0),
      String(b.noteDate || ''),
      String(b.notes || ''),
      JSON.stringify(b.notesHistory || []),
      String(b.rowId || '')
    ]);
  if (brokerValues.length > 0) {
    shB.getRange(2, 1, brokerValues.length, 16).setValues(brokerValues);
  }

  // 2. Restore Request sheet
  const shR = ensureSheetWithHeaders_(ss, 'Request');
  if (shR.getLastRow() > 1) {
    shR.getRange(2, 1, shR.getLastRow() - 1, Math.max(10, shR.getLastColumn())).clearContent();
  }
  const reqValues = requests
    .filter(r => r && (String(r.company || '').trim() || String(r.agentName || '').trim() || String(r.details || '').trim()))
    .map(r => [
      String(r.employee || '').trim(),
      String(r.company || '').trim(),
      String(r.agentName || '').trim(),
      String(r.phone || ''),
      String(r.reqDate || ''),
      String(r.reqType || 'سكني'),
      String(r.editDate || ''),
      String(r.details || ''),
      JSON.stringify(r.detailsHistory || []),
      String(r.rowId || '')
    ]);
  if (reqValues.length > 0) {
    shR.getRange(2, 1, reqValues.length, 10).setValues(reqValues);
  }

  // 3. Restore Access sheet (preserving existing passwords where employee names match)
  if (access.length > 0) {
    const shA = ensureAccessSheet_(ss);
    const existingPassMap = {};
    if (shA.getLastRow() >= 2) {
      const prevRows = shA.getRange(2, 1, shA.getLastRow() - 1, Math.max(5, shA.getLastColumn())).getValues();
      prevRows.forEach(r => {
        const k = String(r[0] || '').trim().toLowerCase();
        if (k) existingPassMap[k] = String(r[4] || '');
      });
      shA.getRange(2, 1, shA.getLastRow() - 1, Math.max(5, shA.getLastColumn())).clearContent();
    }
    const accValues = access
      .filter(a => a && String(a.employee || '').trim())
      .map(a => {
        const name = String(a.employee || '').trim();
        return [
          name,
          String(a.status || 'Active'),
          '',
          String(a.updatedAt || new Date().toISOString()),
          existingPassMap[name.toLowerCase()] || ''
        ];
      });
    if (accValues.length > 0) {
      shA.getRange(2, 1, accValues.length, 5).setValues(accValues);
    }
  }

  // 4. Restore Admins sheet (preserving existing passwords where usernames match)
  if (subAdmins.length > 0) {
    const shAdm = ensureAdminsSheet_(ss);
    const existingAdmPass = {};
    if (shAdm.getLastRow() >= 2) {
      const prevAdm = shAdm.getRange(2, 1, shAdm.getLastRow() - 1, 5).getValues();
      prevAdm.forEach(r => {
        const k = String(r[0] || '').trim().toLowerCase();
        if (k) existingAdmPass[k] = String(r[1] || '');
      });
      shAdm.getRange(2, 1, shAdm.getLastRow() - 1, 5).clearContent();
    }
    const admValues = subAdmins
      .filter(a => a && String(a.username || '').trim())
      .map(a => {
        const u = String(a.username || '').trim();
        return [
          u,
          existingAdmPass[u.toLowerCase()] || '',
          String(a.status || 'Active'),
          JSON.stringify(a.permissions || {}),
          String(a.updatedAt || new Date().toISOString())
        ];
      });
    if (admValues.length > 0) {
      shAdm.getRange(2, 1, admValues.length, 5).setValues(admValues);
    }
  }

  return {
    ok: true,
    verified: true,
    restoredBrokers: brokerValues.length,
    restoredRequests: reqValues.length
  };
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function ensureAdminsSheet_(ss) {
  let sh = ss.getSheetByName('Admins');
  if (!sh) {
    sh = ss.insertSheet('Admins');
    sh.appendRow(['Username', 'Password', 'Status', 'PermissionsJson', 'UpdatedAt']);
  } else if (sh.getLastRow() === 0) {
    sh.appendRow(['Username', 'Password', 'Status', 'PermissionsJson', 'UpdatedAt']);
  }
  return sh;
}

function readAdminsList_(ss) {
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2) return [];
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(5, sh.getLastColumn())).getValues();
  return rows.map(r => ({

  })).filter(x => x.username);

function saveSubAdmin_(ss, username, password, status, permissions) {
  const clean = String(username || '').trim();
  if (!clean) return;
  const sh = ensureAdminsSheet_(ss);
  const nowStr = new Date().toISOString();
  const permsJson = JSON.stringify(permissions || {});
  const lastRow = sh.getLastRow();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, 5).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        const nextPass = String(password || '').trim() ? String(password) : String(rows[i][1] || '');
        sh.getRange(i + 2, 1, 1, 5).setValues([[clean, nextPass, status || 'Active', permsJson, nowStr]]);
        return;
      }
    }
  }
  sh.appendRow([clean, String(password || ''), status || 'Active', permsJson, nowStr]);
}

function deleteSubAdmin_(ss, username) {
  const clean = String(username || '').trim().toLowerCase();
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2 || !clean) return;
  const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
  for (let i = vals.length - 1; i >= 0; i--) {
    if (String(vals[i][0] || '').trim().toLowerCase() === clean) {
      sh.deleteRow(i + 2);
    }
  }
}

function loginSubAdmin_(ss, username, password) {
  const clean = String(username || '').trim().toLowerCase();
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2 || !clean) return { ok: false, state: 'NotFound' };
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 5).getValues();
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][0] || '').trim().toLowerCase() === clean) {
      const st = String(rows[i][2] || 'Active').trim().toLowerCase();
      if (st === 'blocked' || st === 'inactive' || st === 'موقوف') return { ok: false, state: 'Blocked' };
      if (String(rows[i][1] || '') !== String(password || '')) return { ok: false, state: 'WrongPassword' };
      return {
        ok: true,
        admin: {
          username: String(rows[i][0] || '').trim(),
          status: String(rows[i][2] || 'Active').trim(),
          permissions: safeParseJson_(rows[i][3], {})
        }
      };
    }
  }
  return { ok: false, state: 'NotFound' };
}

function deleteEmployeeFromAccess_(ss, empName) {
  const clean = String(empName || '').trim().toLowerCase();
  if (!clean) return;
  ['Access', 'Broker', 'Request'].forEach(tabName => {
    const sh = tabName === 'Access' ? ensureAccessSheet_(ss) : ss.getSheetByName(tabName);
    if (!sh || sh.getLastRow() < 2) return;
    const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
    for (let i = vals.length - 1; i >= 0; i--) {
      if (String(vals[i][0] || '').trim().toLowerCase() === clean) {
        sh.deleteRow(i + 2);
      }
    }
  });
}

function ensureAccessSheet_(ss) {
  let sh = ss.getSheetByName('Access');
  if (!sh) {
    sh = ss.insertSheet('Access');
    sh.appendRow(['Employee', 'Status', 'SessionId', 'UpdatedAt', 'Password']);
  } else if (sh.getLastRow() === 0) {
    sh.appendRow(['Employee', 'Status', 'SessionId', 'UpdatedAt', 'Password']);
  } else {
    if (sh.getLastColumn() < 4) {
      sh.getRange(1, 3, 1, 2).setValues([['SessionId', 'UpdatedAt']]);
    }
    if (sh.getLastColumn() < 5) {
      sh.getRange(1, 5, 1, 1).setValues([['Password']]);
    }
  }
  return sh;
}

function setEmployeePassword_(ss, empName, newPass, stP) {
  const clean = String(empName || '').trim();
  if (!clean) return;
  const shP = ensureAccessSheet_(ss);
  const lastP = shP.getLastRow();
  const nowP = new Date().toISOString();
  if (lastP >= 2) {
    const rowsP = shP.getRange(2, 1, lastP - 1, 1).getValues();
    for (let i = 0; i < rowsP.length; i++) {
      if (String(rowsP[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        shP.getRange(i + 2, 5, 1, 1).setValue(newPass);
        if (stP) shP.getRange(i + 2, 2, 1, 1).setValue(stP);
        shP.getRange(i + 2, 4, 1, 1).setValue(nowP);
        return;
      }
    }
  }
  shP.appendRow([clean, stP || 'Active', '', nowP, newPass]);
}

function checkEmployeeAccessAndSession_(ss, empName, sessionId, bindIfFree) {
  const clean = String(empName || '').trim();
  if (!clean) return { ok: false, state: 'Unregistered' };
  const sh = ensureAccessSheet_(ss);
  const lastRow = sh.getLastRow();
  const nowStr = new Date().toISOString();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, Math.max(5, sh.getLastColumn())).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        const st = String(rows[i][1] || 'Active').trim().toLowerCase();
        if (st === 'blocked' || st === 'inactive' || st === 'no' || st === 'موقوف' || st === 'محظور') {
          return { ok: false, state: 'Blocked' };
        }
        const existingSess = String(rows[i][2] || '').trim();
        const lastUpd = new Date(String(rows[i][3] || '')).getTime();
        const staleMs = 15 * 60 * 1000;
        const isExpired = !lastUpd || (Date.now() - lastUpd > staleMs);
        if (existingSess && sessionId && existingSess !== sessionId && !isExpired) {
          return { ok: false, state: 'InUse' };
        }
        if (bindIfFree && sessionId) {
          sh.getRange(i + 2, 3, 1, 2).setValues([[sessionId, nowStr]]);
        } else if (sessionId && existingSess === sessionId) {
          sh.getRange(i + 2, 4, 1, 1).setValue(nowStr);
        }
        return { ok: true, state: (st === 'paused' || st === 'موقوف مؤقتا' || st === 'موقوف مؤقتاً') ? 'Paused' : 'Active' };
      }
    }
  }
  return { ok: false, state: 'Unregistered' };
}

function setEmployeeAccessStatus_(ss, empName, status, clearSession, password) {
  const clean = String(empName || '').trim();
  if (!clean) return;
  const sh = ensureAccessSheet_(ss);
  const lastRow = sh.getLastRow();
  const nowStr = new Date().toISOString();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, Math.max(5, sh.getLastColumn())).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        sh.getRange(i + 2, 2, 1, 1).setValue(status);
        if (password !== null) {
          sh.getRange(i + 2, 5, 1, 1).setValue(password);
        }
        if (clearSession || status.toLowerCase() === 'blocked') {
          sh.getRange(i + 2, 3, 1, 2).setValues([['', nowStr]]);
        } else {
          sh.getRange(i + 2, 4, 1, 1).setValue(nowStr);
        }
        return;
      }
    }
  }
  sh.appendRow([clean, status, '', nowStr, password || '']);
}

function renameEmployeeEverywhere_(ss, oldName, newName) {
  const shAcc = ensureAccessSheet_(ss);
  const accLast = shAcc.getLastRow();
  let foundInAccess = false;
  if (accLast >= 2) {
    const vals = shAcc.getRange(2, 1, accLast - 1, 1).getValues();
    for (let i = 0; i < vals.length; i++) {
      if (String(vals[i][0] || '').trim().toLowerCase() === oldName.toLowerCase()) {
        shAcc.getRange(i + 2, 1).setValue(newName);
        foundInAccess = true;
      }
    }
  }
  if (!foundInAccess) {
    shAcc.appendRow([newName, 'Active', '', new Date().toISOString(), '']);
  }
  ['Broker', 'Request'].forEach(tab => {
    const sh = ss.getSheetByName(tab);
    if (sh && sh.getLastRow() >= 2) {
      const empCol = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
      for (let i = 0; i < empCol.length; i++) {
        if (String(empCol[i][0] || '').trim().toLowerCase() === oldName.toLowerCase()) {
          sh.getRange(i + 2, 1).setValue(newName);
        }
      }
    }
  });
}

function reassignBrokerToEmployee_(ss, brokerName, fromEmp, targetEmp) {
  ['Broker', 'Request'].forEach(tab => {
    const sh = ss.getSheetByName(tab);
    if (sh && sh.getLastRow() >= 2) {
      const data = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();
      for (let i = 0; i < data.length; i++) {
        const rEmp = String(data[i][0] || '').trim().toLowerCase();
        const rName = String(data[i][1] || '').trim().toLowerCase();
        if (rName === brokerName.toLowerCase() && (!fromEmp || rEmp === fromEmp.toLowerCase())) {
          sh.getRange(i + 2, 1).setValue(targetEmp);
        }
      }
    }
  });
}

function readAccessList_(ss) {

  })).filter(x => x.employee);

function ensureSheetWithHeaders_(ss, name) {
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  const headers = name === 'Broker'
    ? ['Employee','Broker Name','Role','Phone','Sales Count','Orientation Date','Orientation Status','Orientation Count','WorkShop Status','WorkShop Count','Company Rating','Request Count','Note Date','Latest Notes','Notes History','Row ID']
    : ['Employee','Broker Name','Agent Name','Agent Phone','Request Date','Request Type','Edit Date','Request Details','Details History','Row ID'];

}

function upsertRowByIdOrIndex_(sh, rowId, idColIndex, sheetRow, values) {
  const lastRow = sh.getLastRow();
  if (rowId && lastRow >= 2) {
    const ids = sh.getRange(2, idColIndex, lastRow - 1, 1).getValues();
    for (let i = 0; i < ids.length; i++) {
      if (String(ids[i][0] || '').trim() === rowId) {
        sh.getRange(i + 2, 1, 1, values.length).setValues([values]);
        return;
      }
    }
  }
  const empVal = String(values[0] || '').trim().toLowerCase();
  const nameVal = String(values[1] || '').trim().toLowerCase();
  if (idColIndex === 16 && nameVal && lastRow >= 2) {
    const existing = sh.getRange(2, 1, lastRow - 1, 2).getValues();
    for (let i = 0; i < existing.length; i++) {
      const rEmp = String(existing[i][0] || '').trim().toLowerCase();
      const rName = String(existing[i][1] || '').trim().toLowerCase();
      if (rName === nameVal && (!empVal || !rEmp || rEmp === empVal)) {
        sh.getRange(i + 2, 1, 1, values.length).setValues([values]);
        return;
      }
    }
  }
  if (sheetRow && Number(sheetRow) >= 2 && Number(sheetRow) <= lastRow) {
    sh.getRange(Number(sheetRow), 1, 1, values.length).setValues([values]);
    return;
  }
  sh.appendRow(values);
}

<html lang="ar" dir="rtl">

    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4 portrait; margin: 12mm; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #FFFFFF;
      color: #111B2E;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      line-height: 1.5;
    }
    .page { max-width: 794px; margin: 0 auto; }

    /* Executive Header */
    .header {
      background: linear-gradient(135deg, #0F1D36 0%, #172B4D 100%);
      color: #FFFFFF;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #C69C4B;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 11px;
      background: #0B1528; border: 1.5px solid #C69C4B;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 22px; color: #F3D999;
    }
    .header h1 { font-size: 20px; font-weight: 900; color: #FFFFFF; }
    .header .sub { font-size: 12px; color: #E6C782; font-weight: 600; margin-top: 2px; }
    .meta { text-align: left; font-size: 11px; color: #CBD5E1; }
    .meta strong { display: block; font-size: 13px; color: #F3D999; font-weight: 800; }

    /* Lightweight Dashboard KPIs */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: #0F1D36;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title span.line {
      flex: 1;
      height: 1px;
      background: #E2E8F0;
      margin-right: 10px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px 14px;
      background: #F8FAFC;
      text-align: center;
    }
    .kpi-label { font-size: 11px; font-weight: 700; color: #475569; }
    .kpi-num { font-size: 26px; font-weight: 900; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 10px; color: #64748B; font-weight: 600; }

    /* Mini Dashboard Visual Grid */
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .dash-card {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px 14px;
      background: #FFFFFF;
    }
    .dash-card h3 {
      font-size: 11.5px;
      font-weight: 800;
      color: #0F1D36;
      margin-bottom: 10px;
    }
    .mini-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 11px;
    }
    .mini-row:last-child { margin-bottom: 0; }
    .mini-label { width: 92px; font-weight: 700; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-track { flex: 1; height: 9px; background: #F1F5F9; border-radius: 99px; overflow: hidden; }
    .mini-fill { height: 100%; border-radius: 99px; }
    .mini-val { width: 28px; text-align: left; font-weight: 800; color: #0F1D36; font-variant-numeric: tabular-nums; }

    .rating-strip {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #F1F5F9;
      font-size: 10.5px;
      font-weight: 700;
      justify-content: space-between;
    }

    /* Summarized Broker Table */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      overflow: hidden;
      font-size: 11.5px;
      margin-bottom: 16px;
    }
    thead tr {
      background: #0F1D36;
      color: #FFFFFF;
    }
    th {
      padding: 10px 8px;
      font-weight: 800;
      border-bottom: 3px solid #C69C4B;
      text-align: center;
    }
    th.right { text-align: right; }
    td {
      padding: 8px 8px;
      border-bottom: 1px solid #E2E8F0;
      vertical-align: middle;
    }
    td.num { text-align: center; font-variant-numeric: tabular-nums; }
    .rating-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
    }
    tfoot tr {
      background: #FEF9E7;
      border-top: 2px solid #C69C4B;
    }
    tfoot td {
      padding: 11px 8px;
      font-weight: 900;
      color: #0F1D36;
      font-size: 12px;
      border-bottom: none;
    }

    /* Summary Box & Gold Credit Footer */
    .summary-strip {
      background: #0F1D36;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .summary-strip span strong { color: #F3D999; font-size: 14px; margin-right: 4px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid #E2E8F0;
    }
    .footer-note { font-size: 10px; color: #64748B; }
    .gold-frame {
      display: inline-block;
      padding: 5px 14px;
      border: 1.5px solid #C69C4B;
      border-radius: 8px;
      background: linear-gradient(135deg, #FFFDF5 0%, #FEF6DC 100%);
      color: #8A651D;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      direction: ltr;
    }
  </style>
</head>

function doGet(e) {
  const action = (e && e.parameter && e.parameter.action) || 'read';
  const reqEmp = String((e && e.parameter && e.parameter.employee) || '').trim();
  const reqSession = String((e && e.parameter && e.parameter.sessionId) || '').trim();
  const isAdmin = String((e && e.parameter && e.parameter.role) || '').trim() === 'admin';
  const ss = SpreadsheetApp.getActiveSpreadsheet();

  if (!isAdmin && reqEmp) {
    const check = checkEmployeeAccessAndSession_(ss, reqEmp, reqSession, false);
    const accessListNow = readAccessList_(ss);
    if (check.state === 'Blocked') {
      return jsonOut_({ ok: false, blocked: true, access: accessListNow, error: 'تم إيقاف صلاحية هذا الحساب من الإدارة' });
    }
    if (check.state === 'Unregistered') {
      return jsonOut_({ ok: false, unregistered: true, access: accessListNow, error: 'هذا الاسم غير مسجل في الصفحة الأساسية' });
    }
    if (check.state === 'InUse') {
      return jsonOut_({ ok: false, inUse: true, access: accessListNow, error: 'هذا الاسم مستخدم بالفعل في جلسة نشطة أخرى' });
    }
  }

  if (action === 'read') {
    const brokerRows = readSheetRows_(ss, 'Broker');
    const requestRows = readSheetRows_(ss, 'Request');
    const accessList = readAccessList_(ss);
    const adminsList = isAdmin ? readAdminsList_(ss) : [];
    return jsonOut_({ ok: true, broker: brokerRows, request: requestRows, access: accessList, admins: adminsList });
  }

  return jsonOut_({ ok: true, message: 'Proker Central Web App Active' });
}

function doPost(e) {
  try {
    const raw = (e && e.postData && e.postData.contents) ? e.postData.contents : '{}';
    const payload = JSON.parse(raw);
    const action = String(payload.action || 'upsert').trim();
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    if (action === 'adminLogin') {
      return jsonOut_(loginSubAdmin_(ss, payload.username, payload.password));
    }

    if (action === 'saveAdmin') {
      saveSubAdmin_(ss, payload.username, payload.password, payload.status, payload.permissions);
      return jsonOut_({ ok: true });
    }

    if (action === 'deleteAdmin') {
      deleteSubAdmin_(ss, payload.username);
      return jsonOut_({ ok: true });
    }

    if (action === 'deleteEmployee') {
      deleteEmployeeFromAccess_(ss, payload.employee);
      return jsonOut_({ ok: true, verified: true });
    }

    if (action === 'restoreBackup') {
      const result = restoreFullBackup_(ss, payload);
      return jsonOut_(result);
    }

    if (action === 'setAccess') {
      const targetEmp = String(payload.employee || '').trim();
      const status = String(payload.status || 'Active').trim();
      const clearSession = Boolean(payload.clearSession);
      const pass = payload.password !== undefined ? String(payload.password) : null;
      setEmployeeAccessStatus_(ss, targetEmp, status, clearSession, pass);
      return jsonOut_({ ok: true });
    }

    if (action === 'setPassword') {
      const targetEmp = String(payload.employee || '').trim();
      const newPass = String(payload.password || '');
      const stP = String(payload.status || '').trim();
      setEmployeePassword_(ss, targetEmp, newPass, stP);
      return jsonOut_({ ok: true });
    }

    if (action === 'login') {
      const targetEmp = String(payload.employee || '').trim();
      const pass = String(payload.password || '');
      const sessionId = String(payload.sessionId || '').trim();
      const shL = ensureAccessSheet_(ss);
      const lastL = shL.getLastRow();
      if (lastL < 2) return jsonOut_({ ok: false, state: 'Unregistered' });
      const rowsL = shL.getRange(2, 1, lastL - 1, Math.max(5, shL.getLastColumn())).getValues();
      for (let i = 0; i < rowsL.length; i++) {
        if (String(rowsL[i][0] || '').trim().toLowerCase() === targetEmp.toLowerCase()) {
          const stL = String(rowsL[i][1] || 'Active').trim().toLowerCase();
          if (stL === 'blocked' || stL === 'inactive' || stL === 'no' || stL === 'موقوف' || stL === 'محظور') {
            return jsonOut_({ ok: false, state: 'Blocked' });
          }
          const storedPass = String(rowsL[i][4] || '');
          if (!storedPass) return jsonOut_({ ok: false, state: 'NoPassword' });
          if (storedPass !== pass) return jsonOut_({ ok: false, state: 'WrongPassword' });
          if (sessionId) {
            shL.getRange(i + 2, 3, 1, 2).setValues([[sessionId, new Date().toISOString()]]);
          }
          const stateOut = (stL === 'paused' || stL === 'موقوف مؤقتا' || stL === 'موقوف مؤقتاً') ? 'Paused' : 'Active';
          return jsonOut_({ ok: true, state: stateOut });
        }
      }
      return jsonOut_({ ok: false, state: 'Unregistered' });
    }

    if (action === 'deleteRow') {
      const dSheet = payload.sheet === 'Request' ? 'Request' : 'Broker';
      const shD = ss.getSheetByName(dSheet);
      const dId = String(payload.rowId || '').trim();
      const dRowNum = Number(payload.sheetRow || 0);
      const idCol = dSheet === 'Broker' ? 16 : 10;
      if (shD && shD.getLastRow() >= 2) {
        if (dId) {
          const ids = shD.getRange(2, idCol, shD.getLastRow() - 1, 1).getValues();
          for (let i = 0; i < ids.length; i++) {
            if (String(ids[i][0] || '').trim() === dId) {
              shD.deleteRow(i + 2);
              return jsonOut_({ ok: true });
            }
          }
        }
        if (dRowNum >= 2 && dRowNum <= shD.getLastRow()) {
          shD.deleteRow(dRowNum);
        }
      }
      return jsonOut_({ ok: true });
    }

    if (action === 'renameEmployee') {
      const oldName = String(payload.oldEmployee || '').trim();
      const newName = String(payload.newEmployee || '').trim();
      if (oldName && newName) renameEmployeeEverywhere_(ss, oldName, newName);
      return jsonOut_({ ok: true });
    }

    if (action === 'reassignBroker') {
      const brokerName = String(payload.brokerName || '').trim();
      const targetEmp = String(payload.targetEmployee || '').trim();
      const fromEmp = String(payload.fromEmployee || '').trim();
      if (brokerName && targetEmp) reassignBrokerToEmployee_(ss, brokerName, fromEmp, targetEmp);
      return jsonOut_({ ok: true });
    }

    if (action === 'claimSession') {
      const targetEmp = String(payload.employee || '').trim();
      const sessionId = String(payload.sessionId || '').trim();
      return jsonOut_(checkEmployeeAccessAndSession_(ss, targetEmp, sessionId, true));
    }

    const sheetName = payload.sheet === 'Request' ? 'Request' : 'Broker';
    const row = payload.row || {};
    const employee = String(payload.employee || row.employee || '').trim();
    const sessionId = String(payload.sessionId || '').trim();
    const isAdmin = String(payload.role || '').trim() === 'admin';

    if (!isAdmin && employee) {
      const check = checkEmployeeAccessAndSession_(ss, employee, sessionId, true);
      if (check.state === 'Blocked') return jsonOut_({ ok: false, blocked: true, error: 'Account blocked' });
      if (check.state === 'Unregistered') return jsonOut_({ ok: false, unregistered: true, error: 'Account unregistered' });
      if (check.state === 'InUse') return jsonOut_({ ok: false, inUse: true, error: 'Session in use' });
    }

    const rowId = String(row.rowId || '').trim();
    const sh = ensureSheetWithHeaders_(ss, sheetName);

    if (sheetName === 'Broker') {
      const values = [
        employee,
        row.prokerName || '',
        row.role || 'OWNER',
        row.phone || '',
        Number(row.salesCount || 0),
        row.oriDate || '',
        row.oriStatus || 'موعد',
        Number(row.oriCount || 0),
        row.wsStatus || 'لا',
        Number(row.wsCount || 0),
        row.rating || 'جيد',
        Number(row.reqCount || 0),
        row.noteDate || '',
        row.notes || '',
        JSON.stringify(row.notesHistory || []),
        rowId
      ];
      upsertRowByIdOrIndex_(sh, rowId, 16, row.sheetRow, values);
    } else {
      const values = [
        employee,
        row.company || '',
        row.agentName || '',
        row.phone || '',
        row.reqDate || '',
        row.reqType || 'سكني',
        row.editDate || '',
        row.details || '',
        JSON.stringify(row.detailsHistory || []),
        rowId
      ];
      upsertRowByIdOrIndex_(sh, rowId, 10, row.sheetRow, values);
    }

    return jsonOut_({ ok: true, verified: true, ts: new Date().toISOString() });
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err) });
  }
}

function restoreFullBackup_(ss, payload) {
  const brokers = Array.isArray(payload.brokers) ? payload.brokers : [];
  const requests = Array.isArray(payload.requests) ? payload.requests : [];
  const access = Array.isArray(payload.access) ? payload.access : [];
  const subAdmins = Array.isArray(payload.subAdmins) ? payload.subAdmins : [];

  // 1. Restore Broker sheet
  const shB = ensureSheetWithHeaders_(ss, 'Broker');
  if (shB.getLastRow() > 1) {
    shB.getRange(2, 1, shB.getLastRow() - 1, Math.max(16, shB.getLastColumn())).clearContent();
  }
  const brokerValues = brokers
    .filter(b => b && String(b.prokerName || '').trim())
    .map(b => [
      String(b.employee || '').trim(),
      String(b.prokerName || '').trim(),
      String(b.role || 'OWNER'),
      String(b.phone || ''),
      Number(b.salesCount || 0),
      String(b.oriDate || ''),
      String(b.oriStatus || 'موعد'),
      Number(b.oriCount || 0),
      String(b.wsStatus || 'لا'),
      Number(b.wsCount || 0),
      String(b.rating || 'جيد'),
      Number(b.reqCount || 0),
      String(b.noteDate || ''),
      String(b.notes || ''),
      JSON.stringify(b.notesHistory || []),
      String(b.rowId || '')
    ]);
  if (brokerValues.length > 0) {
    shB.getRange(2, 1, brokerValues.length, 16).setValues(brokerValues);
  }

  // 2. Restore Request sheet
  const shR = ensureSheetWithHeaders_(ss, 'Request');
  if (shR.getLastRow() > 1) {
    shR.getRange(2, 1, shR.getLastRow() - 1, Math.max(10, shR.getLastColumn())).clearContent();
  }
  const reqValues = requests
    .filter(r => r && (String(r.company || '').trim() || String(r.agentName || '').trim() || String(r.details || '').trim()))
    .map(r => [
      String(r.employee || '').trim(),
      String(r.company || '').trim(),
      String(r.agentName || '').trim(),
      String(r.phone || ''),
      String(r.reqDate || ''),
      String(r.reqType || 'سكني'),
      String(r.editDate || ''),
      String(r.details || ''),
      JSON.stringify(r.detailsHistory || []),
      String(r.rowId || '')
    ]);
  if (reqValues.length > 0) {
    shR.getRange(2, 1, reqValues.length, 10).setValues(reqValues);
  }

  // 3. Restore Access sheet (preserving existing passwords where employee names match)
  if (access.length > 0) {
    const shA = ensureAccessSheet_(ss);
    const existingPassMap = {};
    if (shA.getLastRow() >= 2) {
      const prevRows = shA.getRange(2, 1, shA.getLastRow() - 1, Math.max(5, shA.getLastColumn())).getValues();
      prevRows.forEach(r => {
        const k = String(r[0] || '').trim().toLowerCase();
        if (k) existingPassMap[k] = String(r[4] || '');
      });
      shA.getRange(2, 1, shA.getLastRow() - 1, Math.max(5, shA.getLastColumn())).clearContent();
    }
    const accValues = access
      .filter(a => a && String(a.employee || '').trim())
      .map(a => {
        const name = String(a.employee || '').trim();
        return [
          name,
          String(a.status || 'Active'),
          '',
          String(a.updatedAt || new Date().toISOString()),
          existingPassMap[name.toLowerCase()] || ''
        ];
      });
    if (accValues.length > 0) {
      shA.getRange(2, 1, accValues.length, 5).setValues(accValues);
    }
  }

  // 4. Restore Admins sheet (preserving existing passwords where usernames match)
  if (subAdmins.length > 0) {
    const shAdm = ensureAdminsSheet_(ss);
    const existingAdmPass = {};
    if (shAdm.getLastRow() >= 2) {
      const prevAdm = shAdm.getRange(2, 1, shAdm.getLastRow() - 1, 5).getValues();
      prevAdm.forEach(r => {
        const k = String(r[0] || '').trim().toLowerCase();
        if (k) existingAdmPass[k] = String(r[1] || '');
      });
      shAdm.getRange(2, 1, shAdm.getLastRow() - 1, 5).clearContent();
    }
    const admValues = subAdmins
      .filter(a => a && String(a.username || '').trim())
      .map(a => {
        const u = String(a.username || '').trim();
        return [
          u,
          existingAdmPass[u.toLowerCase()] || '',
          String(a.status || 'Active'),
          JSON.stringify(a.permissions || {}),
          String(a.updatedAt || new Date().toISOString())
        ];
      });
    if (admValues.length > 0) {
      shAdm.getRange(2, 1, admValues.length, 5).setValues(admValues);
    }
  }

  return {
    ok: true,
    verified: true,
    restoredBrokers: brokerValues.length,
    restoredRequests: reqValues.length
  };
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function ensureAdminsSheet_(ss) {
  let sh = ss.getSheetByName('Admins');
  if (!sh) {
    sh = ss.insertSheet('Admins');
    sh.appendRow(['Username', 'Password', 'Status', 'PermissionsJson', 'UpdatedAt']);
  } else if (sh.getLastRow() === 0) {
    sh.appendRow(['Username', 'Password', 'Status', 'PermissionsJson', 'UpdatedAt']);
  }
  return sh;
}

function readAdminsList_(ss) {
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2) return [];
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(5, sh.getLastColumn())).getValues();
  return rows.map(r => ({
    username: String(r[0] || '').trim(),
    status: String(r[2] || 'Active').trim(),
    permissions: safeParseJson_(r[3], {}),
    updatedAt: String(r[4] || '').trim()
  })).filter(x => x.username);
}

function saveSubAdmin_(ss, username, password, status, permissions) {
  const clean = String(username || '').trim();
  if (!clean) return;
  const sh = ensureAdminsSheet_(ss);
  const nowStr = new Date().toISOString();
  const permsJson = JSON.stringify(permissions || {});
  const lastRow = sh.getLastRow();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, 5).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        const nextPass = String(password || '').trim() ? String(password) : String(rows[i][1] || '');
        sh.getRange(i + 2, 1, 1, 5).setValues([[clean, nextPass, status || 'Active', permsJson, nowStr]]);
        return;
      }
    }
  }
  sh.appendRow([clean, String(password || ''), status || 'Active', permsJson, nowStr]);
}

function deleteSubAdmin_(ss, username) {
  const clean = String(username || '').trim().toLowerCase();
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2 || !clean) return;
  const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
  for (let i = vals.length - 1; i >= 0; i--) {
    if (String(vals[i][0] || '').trim().toLowerCase() === clean) {
      sh.deleteRow(i + 2);
    }
  }
}

function loginSubAdmin_(ss, username, password) {
  const clean = String(username || '').trim().toLowerCase();
  const sh = ss.getSheetByName('Admins');
  if (!sh || sh.getLastRow() < 2 || !clean) return { ok: false, state: 'NotFound' };
  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 5).getValues();
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][0] || '').trim().toLowerCase() === clean) {
      const st = String(rows[i][2] || 'Active').trim().toLowerCase();
      if (st === 'blocked' || st === 'inactive' || st === 'موقوف') return { ok: false, state: 'Blocked' };
      if (String(rows[i][1] || '') !== String(password || '')) return { ok: false, state: 'WrongPassword' };
      return {
        ok: true,
        admin: {
          username: String(rows[i][0] || '').trim(),
          status: String(rows[i][2] || 'Active').trim(),
          permissions: safeParseJson_(rows[i][3], {})
        }
      };
    }
  }
  return { ok: false, state: 'NotFound' };
}

function deleteEmployeeFromAccess_(ss, empName) {
  const clean = String(empName || '').trim().toLowerCase();
  if (!clean) return;
  ['Access', 'Broker', 'Request'].forEach(tabName => {
    const sh = tabName === 'Access' ? ensureAccessSheet_(ss) : ss.getSheetByName(tabName);
    if (!sh || sh.getLastRow() < 2) return;
    const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
    for (let i = vals.length - 1; i >= 0; i--) {
      if (String(vals[i][0] || '').trim().toLowerCase() === clean) {
        sh.deleteRow(i + 2);
      }
    }
  });
}

function ensureAccessSheet_(ss) {
  let sh = ss.getSheetByName('Access');
  if (!sh) {
    sh = ss.insertSheet('Access');
    sh.appendRow(['Employee', 'Status', 'SessionId', 'UpdatedAt', 'Password']);
  } else if (sh.getLastRow() === 0) {
    sh.appendRow(['Employee', 'Status', 'SessionId', 'UpdatedAt', 'Password']);
  } else {
    if (sh.getLastColumn() < 4) {
      sh.getRange(1, 3, 1, 2).setValues([['SessionId', 'UpdatedAt']]);
    }
    if (sh.getLastColumn() < 5) {
      sh.getRange(1, 5, 1, 1).setValues([['Password']]);
    }
  }
  return sh;
}

function setEmployeePassword_(ss, empName, newPass, stP) {
  const clean = String(empName || '').trim();
  if (!clean) return;
  const shP = ensureAccessSheet_(ss);
  const lastP = shP.getLastRow();
  const nowP = new Date().toISOString();
  if (lastP >= 2) {
    const rowsP = shP.getRange(2, 1, lastP - 1, 1).getValues();
    for (let i = 0; i < rowsP.length; i++) {
      if (String(rowsP[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        shP.getRange(i + 2, 5, 1, 1).setValue(newPass);
        if (stP) shP.getRange(i + 2, 2, 1, 1).setValue(stP);
        shP.getRange(i + 2, 4, 1, 1).setValue(nowP);
        return;
      }
    }
  }
  shP.appendRow([clean, stP || 'Active', '', nowP, newPass]);
}

function checkEmployeeAccessAndSession_(ss, empName, sessionId, bindIfFree) {
  const clean = String(empName || '').trim();
  if (!clean) return { ok: false, state: 'Unregistered' };
  const sh = ensureAccessSheet_(ss);
  const lastRow = sh.getLastRow();
  const nowStr = new Date().toISOString();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, Math.max(5, sh.getLastColumn())).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        const st = String(rows[i][1] || 'Active').trim().toLowerCase();
        if (st === 'blocked' || st === 'inactive' || st === 'no' || st === 'موقوف' || st === 'محظور') {
          return { ok: false, state: 'Blocked' };
        }
        const existingSess = String(rows[i][2] || '').trim();
        const lastUpd = new Date(String(rows[i][3] || '')).getTime();
        const staleMs = 15 * 60 * 1000;
        const isExpired = !lastUpd || (Date.now() - lastUpd > staleMs);
        if (existingSess && sessionId && existingSess !== sessionId && !isExpired) {
          return { ok: false, state: 'InUse' };
        }
        if (bindIfFree && sessionId) {
          sh.getRange(i + 2, 3, 1, 2).setValues([[sessionId, nowStr]]);
        } else if (sessionId && existingSess === sessionId) {
          sh.getRange(i + 2, 4, 1, 1).setValue(nowStr);
        }
        return { ok: true, state: (st === 'paused' || st === 'موقوف مؤقتا' || st === 'موقوف مؤقتاً') ? 'Paused' : 'Active' };
      }
    }
  }
  return { ok: false, state: 'Unregistered' };
}

function setEmployeeAccessStatus_(ss, empName, status, clearSession, password) {
  const clean = String(empName || '').trim();
  if (!clean) return;
  const sh = ensureAccessSheet_(ss);
  const lastRow = sh.getLastRow();
  const nowStr = new Date().toISOString();
  if (lastRow >= 2) {
    const rows = sh.getRange(2, 1, lastRow - 1, Math.max(5, sh.getLastColumn())).getValues();
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] || '').trim().toLowerCase() === clean.toLowerCase()) {
        sh.getRange(i + 2, 2, 1, 1).setValue(status);
        if (password !== null) {
          sh.getRange(i + 2, 5, 1, 1).setValue(password);
        }
        if (clearSession || status.toLowerCase() === 'blocked') {
          sh.getRange(i + 2, 3, 1, 2).setValues([['', nowStr]]);
        } else {
          sh.getRange(i + 2, 4, 1, 1).setValue(nowStr);
        }
        return;
      }
    }
  }
  sh.appendRow([clean, status, '', nowStr, password || '']);
}

function renameEmployeeEverywhere_(ss, oldName, newName) {
  const shAcc = ensureAccessSheet_(ss);
  const accLast = shAcc.getLastRow();
  let foundInAccess = false;
  if (accLast >= 2) {
    const vals = shAcc.getRange(2, 1, accLast - 1, 1).getValues();
    for (let i = 0; i < vals.length; i++) {
      if (String(vals[i][0] || '').trim().toLowerCase() === oldName.toLowerCase()) {
        shAcc.getRange(i + 2, 1).setValue(newName);
        foundInAccess = true;
      }
    }
  }
  if (!foundInAccess) {
    shAcc.appendRow([newName, 'Active', '', new Date().toISOString(), '']);
  }
  ['Broker', 'Request'].forEach(tab => {
    const sh = ss.getSheetByName(tab);
    if (sh && sh.getLastRow() >= 2) {
      const empCol = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
      for (let i = 0; i < empCol.length; i++) {
        if (String(empCol[i][0] || '').trim().toLowerCase() === oldName.toLowerCase()) {
          sh.getRange(i + 2, 1).setValue(newName);
        }
      }
    }
  });
}

function reassignBrokerToEmployee_(ss, brokerName, fromEmp, targetEmp) {
  ['Broker', 'Request'].forEach(tab => {
    const sh = ss.getSheetByName(tab);
    if (sh && sh.getLastRow() >= 2) {
      const data = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();
      for (let i = 0; i < data.length; i++) {
        const rEmp = String(data[i][0] || '').trim().toLowerCase();
        const rName = String(data[i][1] || '').trim().toLowerCase();
        if (rName === brokerName.toLowerCase() && (!fromEmp || rEmp === fromEmp.toLowerCase())) {
          sh.getRange(i + 2, 1).setValue(targetEmp);
        }
      }
    }
  });
}

function readAccessList_(ss) {
  const sh = ensureAccessSheet_(ss);
  if (sh.getLastRow() < 2) return [];
  const cols = Math.max(5, sh.getLastColumn());
  return sh.getRange(2, 1, sh.getLastRow() - 1, cols).getValues().map(r => ({
    employee: String(r[0] || '').trim(),
    status: String(r[1] || 'Active').trim(),
    sessionId: String(r[2] || '').trim(),
    updatedAt: String(r[3] || '').trim(),
    hasPassword: String(r[4] || '').trim().length > 0
  })).filter(x => x.employee);
}

function ensureSheetWithHeaders_(ss, name) {
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  const headers = name === 'Broker'
    ? ['Employee','Broker Name','Role','Phone','Sales Count','Orientation Date','Orientation Status','Orientation Count','WorkShop Status','WorkShop Count','Company Rating','Request Count','Note Date','Latest Notes','Notes History','Row ID']
    : ['Employee','Broker Name','Agent Name','Agent Phone','Request Date','Request Type','Edit Date','Request Details','Details History','Row ID'];
  if (sh.getLastRow() === 0) {
    sh.appendRow(headers);
  } else if (sh.getLastColumn() < headers.length) {
    sh.getRange(1, headers.length, 1, 1).setValue('Row ID');
  }
  return sh;
}

function upsertRowByIdOrIndex_(sh, rowId, idColIndex, sheetRow, values) {
  const lastRow = sh.getLastRow();
  if (rowId && lastRow >= 2) {
    const ids = sh.getRange(2, idColIndex, lastRow - 1, 1).getValues();
    for (let i = 0; i < ids.length; i++) {
      if (String(ids[i][0] || '').trim() === rowId) {
        sh.getRange(i + 2, 1, 1, values.length).setValues([values]);
        return;
      }
    }
  }
  const empVal = String(values[0] || '').trim().toLowerCase();
  const nameVal = String(values[1] || '').trim().toLowerCase();
  if (idColIndex === 16 && nameVal && lastRow >= 2) {
    const existing = sh.getRange(2, 1, lastRow - 1, 2).getValues();
    for (let i = 0; i < existing.length; i++) {
      const rEmp = String(existing[i][0] || '').trim().toLowerCase();
      const rName = String(existing[i][1] || '').trim().toLowerCase();
      if (rName === nameVal && (!empVal || !rEmp || rEmp === empVal)) {
        sh.getRange(i + 2, 1, 1, values.length).setValues([values]);
        return;
      }
    }
  }
  if (sheetRow && Number(sheetRow) >= 2 && Number(sheetRow) <= lastRow) {
    sh.getRange(Number(sheetRow), 1, 1, values.length).setValues([values]);
    return;
  }
  sh.appendRow(values);
}

function formatDateCell_(v) {
  if (!v) return '';
  if (v instanceof Date) {
    return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');
  }
  return String(v);
}

function readSheetRows_(ss, name) {
  const sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() < 2) return [];
  const cols = Math.max(sh.getLastColumn(), name === 'Broker' ? 16 : 10);
  const data = sh.getRange(2, 1, sh.getLastRow() - 1, cols).getValues();
  if (name === 'Broker') {
    return data.map((r, idx) => ({
      sheetRow: idx + 2,
      employee: String(r[0] || ''),
      prokerName: String(r[1] || ''),
      role: String(r[2] || 'OWNER'),
      phone: String(r[3] || ''),
      salesCount: Number(r[4] || 0),
      oriDate: formatDateCell_(r[5]),
      oriStatus: String(r[6] || 'موعد'),
      oriCount: Number(r[7] || 0),
      wsStatus: String(r[8] || 'لا'),
      wsCount: Number(r[9] || 0),
      rating: String(r[10] || 'جيد'),
      reqCount: Number(r[11] || 0),
      noteDate: formatDateCell_(r[12]),
      notes: String(r[13] || ''),
      notesHistory: safeParseJson_(r[14], []),
      rowId: String(r[15] || ('b_sheet_' + (idx + 2)))
    }));
  }
  return data.map((r, idx) => ({
    sheetRow: idx + 2,
    employee: String(r[0] || ''),
    company: String(r[1] || ''),
    agentName: String(r[2] || ''),
    phone: String(r[3] || ''),
    reqDate: formatDateCell_(r[4]),
    reqType: String(r[5] || 'سكني'),
    editDate: formatDateCell_(r[6]),
    details: String(r[7] || ''),
    detailsHistory: safeParseJson_(r[8], []),
    rowId: String(r[9] || ('r_sheet_' + (idx + 2)))
  }));
}

function safeParseJson_(val, fallback) {
  try {
    if (!val) return fallback;
    return typeof val === 'string' ? JSON.parse(val) : val;
  } catch (e) {
